name: CI (verify + deploy)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Node.js 20 deprecated 2026-09-16 — 모든 javascript action 을 Node 24 로 강제.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Fast deploy 분리 (2026-05-31): unit + light integration 만 (R&D 25개
      # sweep 은 vitest.config.ts 의 exclude 로 제외, nightly-rd.yml 가 담당).
      # 사용자 catch: 매 push 1h 13m verify 영역 deploy 차단 영역 불편.
      # 직전 #508 / #509 — unit test fail 영역 1h R&D 영역 뒤 보고. 분리 후 ~5분.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:integration

      # Production integration 측정 JSON 영역 artifact upload (light set).
      # R&D 전체 sweep 측정 JSON 영역 nightly-rd.yml 영역 별도 upload.
      - name: Upload production measurement results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snn-measurements-${{ github.sha }}
          path: tests/integration/measurements/
          retention-days: 90

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NODE_ENV: production
      - run: touch out/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
